opencollection: 1.0.0

info:
  name: spring-6-reactive-mongo restRequests
  version: "1"

request:
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{tokenUrl}}"
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: basic_auth_header
    scope: message.read message.write
    tokenConfig:
      id: auth-id
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false
  scripts:
    - type: before-request
      code: |-
        function randomHex(length) {
          let result = "";
          const chars = "0123456789abcdef";
          for (let i = 0; i < length; i++) {
            result += chars[Math.floor(Math.random() * chars.length)];
          }
          return result;
        }

        bru.setVar("traceId", randomHex(32));
        bru.setVar("spanId", randomHex(16));

        const clientId = bru.getProcessEnv("BRUNO_CLIENT_ID") || bru.getEnvVar("clientId") || "messaging-client";
        const clientSecret = bru.getProcessEnv("BRUNO_CLIENT_SECRET") || bru.getEnvVar("clientSecret") || "secret";
        bru.setVar("clientId", clientId);
        bru.setVar("clientSecret", clientSecret);
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
      - tools

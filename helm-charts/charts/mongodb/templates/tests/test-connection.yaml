apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mongodb.fullname" . | trunc 63 | trimSuffix "-" }}-test"
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test-mongodb-connection
      image: {{ .Values.mongoImage.repository }}:{{ .Values.mongoImage.tag }}
      imagePullPolicy: {{ .Values.mongoImage.pullPolicy }}
      command: [ "/bin/sh", "-c" ]
      args:
        - |
          set +o errexit
          echo ">>> Start Test MongoDB"

          # Verbindung testen
          echo ">>> Testing MongoDB connection to {{ include "mongodb.fullname" . }}"
          mongosh --host {{ include "mongodb.fullname" . }} \
                  --port {{ .Values.mongodb.port }} \
                  --username "$MONGO_INITDB_ROOT_USERNAME" \
                  --password "$MONGO_INITDB_ROOT_PASSWORD" \
                  --eval "db.adminCommand('ping')"
          echo "Exit code: $?"

          echo ">>> End Test MongoDB"
      env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "mongodb.fullname" . }}-secrets
              key: MONGO_INITDB_ROOT_USERNAME
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "mongodb.fullname" . }}-secrets
              key: MONGO_INITDB_ROOT_PASSWORD
  restartPolicy: Never
